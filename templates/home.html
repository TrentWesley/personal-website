{% extends "base.html" %}

{% block content %}

<h2>Home</h2>

<h3>My Goals</h3>

<ul>
    {% for goal in goals %}
        <li>
            {{ goal.name }}

            {% if goal.completed %}
                - Completed
            {% else %}
                - In progress
            {% endif %}
        </li>
    {% endfor %}
</ul>

{% endblock content %}
